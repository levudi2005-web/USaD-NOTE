---
name: pages-sign-in
title: Đăng nhập
layout: auth.hbs
active: { auth: true, sign-in: true }
meta_description: "Đăng nhập vào không gian tri thức NOTE."
---

<div class="text-center mt-4">
  <h1 class="h2">Chào mừng bạn quay lại</h1>
  <p class="lead">
    Đăng nhập để tiếp tục sử dụng không gian NOTE.
  </p>
</div>

<div class="card">
  <div class="card-body">
    <div class="m-sm-3">
      <form data-login-form>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control form-control-lg" type="email" name="email" placeholder="Nhập email" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Mật khẩu</label>
          <input class="form-control form-control-lg" type="password" name="password" placeholder="Nhập mật khẩu" required />
        </div>
        <div>
          <div class="form-check align-items-center">
            <input id="customControlInline" type="checkbox" class="form-check-input" value="remember-me" name="remember-me" checked>
            <label class="form-check-label text-small" for="customControlInline">Ghi nhớ tôi</label>
          </div>
        </div>
        <div class="d-grid gap-2 mt-3">
          <button type="submit" class="btn btn-lg btn-primary">Đăng nhập</button>
        </div>
      </form>
    </div>
  </div>
</div>
<p class="text-center mb-3">
  Chưa có tài khoản? <a href="pages-sign-up.html">Đăng ký</a>
</p>
